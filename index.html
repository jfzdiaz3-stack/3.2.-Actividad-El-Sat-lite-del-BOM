<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventana Principal</title>
</head>

<body>

    <h1>Ventana Principal</h1>

    <button id="btnLanzar">
        Lanzar Ventana Satélite
    </button>

    <script>
        const boton = document.getElementById('btnLanzar');

        boton.addEventListener('click', () => {

            const ancho = 400;
            const alto = 300;

            const izquierda = (screen.availWidth - ancho) / 2;
            const arriba = (screen.availHeight - alto) / 2;

            window.open("satelite.html", "satelite", `width=${ancho}, height=${alto}, left=${izquierda}, top=${arriba}`);
        });

    </script>

</body>

</html>
