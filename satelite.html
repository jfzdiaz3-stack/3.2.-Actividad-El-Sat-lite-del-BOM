<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satélite</title>
</head>

<body>

    <h1>Ventana Satélite</h1>

    <p id="mensaje"></p>


    <button id="btnAssign">
        Redirigir con Historial
    </button>

    <button id="btnReplace">
        Redirigir sin Historial
    </button>

    <script>
        const userAgent = navigator.userAgent;

        let sistema = "Desconocido";

        if (userAgent.includes("Windows")) {
            sistema = "Windows";
        } else if (userAgent.includes("Mac")) {
            sistema = "Mac";
        } else if (userAgent.includes("Linux")) {
            sistema = "Linux";
        }

        document.getElementById("mensaje").textContent =
            `Bienvenido, estás navegando desde ${sistema}`;



        const btnAssign = document.getElementById("btnAssign");

        btnAssign.addEventListener("click", () => {


            if (window.opener) {
                window.opener.location.assign("https://www.ilerna.es");
            }

        });



        const btnReplace = document.getElementById("btnReplace");

        btnReplace.addEventListener("click", () => {

            if (window.opener) {
                window.opener.location.replace("https://www.ilerna.es");
            }

        });

    </script>
</body>

</html>
